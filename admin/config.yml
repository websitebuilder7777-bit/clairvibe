backend:
  name: github
  repo: websitebuilder7777-bit/clairvibe
  branch: main

media_folder: ""
public_folder: ""

collections:
  - name: "site_content"
    label: "Site Content"
    files:
      - file: "data/content.json"
        label: "Website Media & Content"
        name: "content"
        fields:
          - {label: "Hero Video", name: "hero_video", widget: "file"}
          - {label: "About Image", name: "about_image", widget: "image"}
          - label: "Portfolio: Heavy Machinery"
            name: "portfolio_machines"
            widget: "object"
            fields:
              - {label: "Cover Image", name: "cover", widget: "image"}
              - {label: "Gallery Images", name: "images", widget: "list", field: {name: "image", widget: "image"}}
          - label: "Portfolio: Food & FMCG"
            name: "portfolio_food"
            widget: "object"
            fields:
              - {label: "Cover Image", name: "cover", widget: "image"}
              - {label: "Gallery Images", name: "images", widget: "list", field: {name: "image", widget: "image"}}
          - label: "Portfolio: Corporate"
            name: "portfolio_corporate"
            widget: "object"
            fields:
              - {label: "Cover Image", name: "cover", widget: "image"}
              - {label: "Gallery Images", name: "images", widget: "list", field: {name: "image", widget: "image"}}
